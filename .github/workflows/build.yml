name: Compile iOS Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Theos Environment
      run: |
        git clone --recursive https://github.com ~/theos
        echo "THEOS=~/theos" >> $GITHUB_ENV
        
    - name: Download iOS SDK Headers
      run: |
        mkdir -p ~/theos/sdks
        curl -LO https://github.com
        tar -xf iPhoneOS16.5.sdk.tar.xz -C ~/theos/sdks/
        
    - name: Compile Dynamic Library
      run: |
        make package FINALPACKAGE=1
        
    - name: Upload Compiled Binary Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: waios2gdrive-Binary
        path: .theos/obj/debug/waios2gdrive.dylib
