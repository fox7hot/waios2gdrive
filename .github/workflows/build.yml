name: Build iOS Dynamic Library

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        shell: bash
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDKs
        shell: bash
        run: |
          mkdir -p "$HOME/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/theos/sdks"

      - name: Build dynamic library
        shell: bash
        run: |
          set -o pipefail
          make clean
          make
          mkdir -p build
          find . -path './.git' -prune -o -type f -name '*.dylib' -print -exec cp '{}' build/ \;
          if ! find build -maxdepth 1 -type f -name '*.dylib' -print -quit | grep -q .; then
            echo "Build completed but no dylib artifact was found."
            exit 1
          fi
          ls -lh build/

      - name: Upload dynamic library
        uses: actions/upload-artifact@v4
        with:
          name: WA2Drive-dylib
          path: build/*.dylib
          if-no-files-found: error
