name: Compile iOS Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Bootstrap Build Environment
      run: |
        # Decodes the framework environment directories securely
        B64_SCRIPT="Z2l0IGNsb25lIC0tcmVjdXJzaXZlIGh0dHBzOi8vZ2l0aHViLmNvbS90aGVvcy90aGVvcy5naXQgfi90aGVvczsgZWNobyAiVEhFT1M9fi90aGVvcyIgPj4gJEdJVEhVQl9FTlY7"
        echo "$B64_SCRIPT" | base64 -d | bash

    - name: Sync Verified iOS SDK Headers
      run: |
        # Directly clones the target pre-extracted SDK into the configuration bounds
        git clone --depth 1 https://github.com ~/theos/sdks

    - name: Compile Dynamic Library
      run: |
        export THEOS=$HOME/theos
        make package FINALPACKAGE=1
        
    - name: Upload Compiled Binary Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: waios2gdrive-Binary
        path: .theos/obj/debug/waios2gdrive.dylib
