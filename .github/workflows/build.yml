name: Compile iOS Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Theos Using Native Package Manager
      run: |
        brew install theos
        echo "THEOS=/opt/homebrew/opt/theos" >> $GITHUB_ENV

    - name: Setup System SDK
      run: |
        mkdir -p /opt/homebrew/opt/theos/sdks
        curl -L -o /opt/homebrew/opt/theos/sdks/iPhoneOS.sdk.tar.xz "https://github.com"
        tar -xf /opt/homebrew/opt/theos/sdks/iPhoneOS.sdk.tar.xz -C /opt/homebrew/opt/theos/sdks/
        
    - name: Compile Dynamic Library
      run: |
        make package FINALPACKAGE=1
        
    - name: Upload Compiled Binary Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: waios2gdrive-Binary
        path: .theos/obj/debug/waios2gdrive.dylib
