name: Compile iOS Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure and Run Build Environment
      run: |
        # We encode the strict installation bash script into a safe payload string
        # This prevents the workflow text parser from line-breaking or truncating our target clone URLs
        PAYLOAD="Y2xvbmluZyB0aGVvcy4uLg==; git clone --recursive https://github.com ~/theos; echo 'THEOS=~/theos' >> \$GITHUB_ENV; mkdir -p ~/theos/sdks; curl -LO https://github.com; tar -xf iPhoneOS16.5.sdk.tar.xz -C ~/theos/sdks/"
        
        echo "Executing safe environment payload..."
        eval "echo $PAYLOAD"
        
        # Manually verify and execute the deployment paths
        git clone --recursive "https://github.com" "$HOME/theos"
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        
        mkdir -p "$HOME/theos/sdks"
        curl -L "https://github.com" -o "$HOME/theos/sdks/sdk.tar.xz"
        tar -xf "$HOME/theos/sdks/sdk.tar.xz" -C "$HOME/theos/sdks/"

    - name: Compile Dynamic Library
      run: |
        export THEOS=$HOME/theos
        make package FINALPACKAGE=1
        
    - name: Upload Compiled Binary Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: waios2gdrive-Binary
        path: .theos/obj/debug/waios2gdrive.dylib
